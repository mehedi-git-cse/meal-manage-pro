services:
  app:
    image: mehedihasancse/meal-manage-pro:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meal_app
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-meal_management}
      DB_USERNAME: ${DB_USERNAME:-meal_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      - storage_data:/var/www/html/storage/app
      - logs_data:/var/www/html/storage/logs
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - meal_network

  db:
    image: mysql:8.0
    container_name: meal_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-meal_management}
      MYSQL_USER: ${DB_USERNAME:-meal_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meal_network

  redis:
    image: redis:7-alpine
    container_name: meal_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meal_network

volumes:
  db_data:
  redis_data:
  storage_data:
  logs_data:

networks:
  meal_network:
    driver: bridge
